# B1: features, eligibility and training arrays (scripts/build_features.py).
paths:
  prices: data/clean/prices.parquet
  benchmarks: data/clean/benchmarks.parquet
  macro: data/clean/macro.parquet
  exclusions: data/meta/exclusions.parquet
  manifest: data/manifest.json
  out_dir: artifacts/features
  report: reports/B1_features.md
  figures: reports/figures/B1_features
  log_file: logs/build_features.log

# All windows in trading days (rows of the series), weekly windows in completed weeks.
stock:
  trend:                         # shared with the index features
    sma: [50, 150, 200]
    slope_sma: 200
    slope_lag: 20                # SMA200 slope = 20-day % change
    rsi: 14
    hi_lo_window: 252
  atr: 14
  volume_window: 50              # volume ratio = volume / mean of the previous 50 days
  dollar_volume_window: 50       # mean of close_raw x volume_raw over the last 50 days (incl. today)
  momentum: [63, 126]            # 3 / 6 months
  momentum_12m: [252, 21]        # 12 months, skipping the last month
  rs_benchmark: ^GSPC
  rs_sma: 200                    # RS level = log(RS / SMA200(RS)), RS = close / ^GSPC
  rs_change: 63                  # 3-month log change of RS
  big_gap_atr: 3.0               # |open / prev close - 1| > 3 x previous day's ATR%

weekly:                          # weeks end Friday; a week is visible from its last NYSE session
  rsi: 14
  sma: [10, 40]
  volume_window: 10              # weekly volume / mean of the previous 10 weeks

market:
  indices: {gspc: ^GSPC, ndx: ^NDX, rut: ^RUT}
  vix: ^VIX
  vix3m: ^VIX3M
  vix_percentile_window: 252
  vix_change: 5                  # 5-day log change
  realized_vol_window: 20        # annualized std of daily log returns
  ffill_limit: 5                 # max sessions a missing index value is carried forward
  macro: [T10Y2Y]                # HY OAS (BAMLH0A0HYM2) only from 2023-10 on FRED -> not used
  macro_lag_sessions: 1          # FRED value dated d is usable from the next session after d

eligibility:
  min_price: 5.0                 # close_raw
  min_dollar_volume: 15.0e+6     # 50-day mean dollar volume
  dollar_volume_variants: [5.0e+6, 30.0e+6]
  min_history: 300               # rows of history including today
  hysteresis: true
  off_days: 10                   # loses eligibility after failing price / dollar volume this many days in a row

build:
  workers: 16
  report_start: "1995-01-01"     # first year in the filter report (training samples start here)
