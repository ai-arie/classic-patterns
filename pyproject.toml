[project]
name = "classic-patterns"
version = "0.1.0"
description = "Research project: detect cup-and-handle and head-and-shoulders patterns in US daily stock data and evaluate how they play out."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
data = [
    "yfinance",
    "pandas_market_calendars",
    "requests",
    "tqdm",
    "lxml",
    "matplotlib",
]
app = [
    "onnxruntime",
    "lightgbm",
    "scipy",
    "streamlit",
    "plotly",
    "yfinance",
]
dev = [
    "pytest",
    "ruff",
    "reportlab",
    "markdown-it-py",
    "watchdog>=6.0.0",
]
train = [
    "torch>=2.6",
    "chronos-forecasting>=2.3",
    "transformers",
    "peft",
    "accelerate",
    "lightgbm",
    "optuna",
    "mlflow",
    "scikit-learn",
    "scipy",
    "pandas_market_calendars",
    "matplotlib",
    "plotly",
    "onnx",
    "onnxruntime",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classic_patterns"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".cache", ".tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]   # verbatim fixture lines

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sample_data: needs the downloaded 20-ticker sample under data/raw (skipped if missing)",
    "real_data: needs data/clean (skipped if missing)",
]

[tool.uv]
python-preference = "only-managed"
